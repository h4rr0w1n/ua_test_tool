# Test Case: CTSW006 - Message payload validation with maximum message data size testing
# Description: Payload size validation including maximum message data size per ICAO standards
# Reference: EUR Doc 047 Appendix A, Page 22; ICAO Doc 9880 Part II (Doc 020), Section 4.5.4
#            EUR Doc 047 Main Document, Section 4.4.2 (Maximum Message Data Size)
# Test Criteria: Successful if IUT validates payload sizes and rejects messages exceeding limits
# Verification: Check payload size handling, maximum message data size enforcement, NDR generation

# ============================================================================
# MESSAGE PAYLOAD VALIDATION WITH MAXIMUM MESSAGE DATA SIZE TESTING
# Messages shall be validated against configured maximum message data size limits
# as specified in ICAO Doc 9880 Part II and EUR Doc 047
# ============================================================================

# Subcase 1: Text payload - within limits
subcase.1.id=CTSW006.1
subcase.1.name=Text Payload - Within Limits
subcase.1.description=Basic ATS message with text payload within maximum size limit
subcase.1.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW006.1 - Text Payload Standard
subcase.1.amhs.priority=FF
subcase.1.amhs.priority-indicator=FF
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Test message with standard payload within size limits
subcase.1.amhs.payload-size=1024
subcase.1.amhs.max-message-data-size=131072
subcase.1.amhs.expected-ndr=false
subcase.1.amhs.size-validation=passed

# Subcase 2: Extended content - approaching limit
subcase.2.id=CTSW006.2
subcase.2.name=Extended Content - Near Limit
subcase.2.description=ATS message with extended content approaching maximum size
subcase.2.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW006.2 - Extended Content Near Limit
subcase.2.amhs.priority=SS
subcase.2.amhs.priority-indicator=SS
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=Test message with extended content approaching maximum payload size
subcase.2.amhs.payload-size=100000
subcase.2.amhs.max-message-data-size=131072
subcase.2.amhs.expected-ndr=false
subcase.2.amhs.size-validation=passed

# Subcase 3: Maximum message data size test - at limit
subcase.3.id=CTSW006.3
subcase.3.name=Maximum Message Data Size - At Limit
subcase.3.description=ATS message with payload exactly at maximum message data size limit
subcase.3.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.3.amhs.subject=CTSW006.3 - Maximum Size At Limit
subcase.3.amhs.priority=FF
subcase.3.amhs.priority-indicator=FF
subcase.3.amhs.body-part-type=ia5-text
subcase.3.amhs.content=Test message with payload exactly at maximum message data size (131072 bytes)
subcase.3.amhs.payload-size=131072
subcase.3.amhs.max-message-data-size=131072
subcase.3.amhs.expected-ndr=false
subcase.3.amhs.size-validation=passed

# Subcase 4: Maximum message data size test - exceeds limit
subcase.4.id=CTSW006.4
subcase.4.name=Maximum Message Data Size - Exceeds Limit
subcase.4.description=ATS message with payload exceeding maximum message data size - NDR expected
subcase.4.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.4.amhs.subject=CTSW006.4 - Maximum Size Exceeded
subcase.4.amhs.priority=FF
subcase.4.amhs.priority-indicator=FF
subcase.4.amhs.body-part-type=ia5-text
subcase.4.amhs.content=Test message with payload exceeding maximum message data size limit
subcase.4.amhs.payload-size=131073
subcase.4.amhs.max-message-data-size=131072
subcase.4.amhs.expected-ndr=true
subcase.4.amhs.ndr-reason=unable-to-transfer
subcase.4.amhs.ndr-diagnostic=content-length-exceeded
subcase.4.amhs.size-validation=failed

# Subcase 5: Large payload with general-text-body-part
subcase.5.id=CTSW006.5
subcase.5.name=Large Payload - General Text Body Part
subcase.5.description=ATS message with large payload using general-text-body-part format
