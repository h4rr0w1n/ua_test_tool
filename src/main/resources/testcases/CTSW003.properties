# Test Case: CTSW003 - Generate a DR for a successfully translated IPM
# Description: Test DR generation when originator or originating MTA requests report
# Reference: EUR Doc 047 Appendix A, Page 19, Section 4.4.8
# Test Criteria: Successful if IUT returns DR for successfully translated ATS message
#                when report was requested by originator or originating MTA
# Verification: Check DRs received at AMHS interface per ICAO Doc 9880 Part II 4.5.6

# Table from spec - Expected results:
# Row 1: no-report(0) + non-delivery-report(1) => No DR
# Row 2: no-report(0) + report(2) => DR returned
# Row 3: no-report(0) + audited-report(3) => DR returned
# Row 4: non-delivery-report(1) + non-delivery-report(1) => No DR
# Row 5: non-delivery-report(1) + report(2) => DR returned
# Row 6: non-delivery-report(1) + audited-report(3) => DR returned

# ============================================================================
# TEST MATRIX FOR ORIGINATOR-REPORT-REQUEST AND ORIGINATING-MTA-REPORT-REQUEST
# All messages have ATS-Message-Priority "FF" and address AMQP consumer
# ============================================================================

# Subcase 1: no-report(0) + non-delivery-report(1) => NO DR expected
subcase.1.id=CTSW003.1
subcase.1.name=No Report Requested (Originator) + NDR Only (MTA)
subcase.1.description=ATS message with originator-report-request=no-report, originating-MTA-report-request=non-delivery-report
subcase.1.amhs.recipient=/CN=AMQP_CONSUMER_1/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/
subcase.1.amhs.subject=CTSW003.1 - No Report Expected
subcase.1.amhs.priority=FF
subcase.1.amhs.priority-indicator=FF
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=ATS message text - no DR expected per test matrix row 1
subcase.1.amhs.originator-report-request=no-report
subcase.1.amhs.originating-mta-report-request=non-delivery-report
subcase.1.amhs.expected-dr=false

# Subcase 2: no-report(0) + report(2) => DR expected
subcase.2.id=CTSW003.2
subcase.2.name=No Report (Originator) + Report (MTA)
subcase.2.description=ATS message with originator-report-request=no-report, originating-MTA-report-request=report
subcase.2.amhs.recipient=/CN=AMQP_CONSUMER_1/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/
subcase.2.amhs.subject=CTSW003.2 - DR Expected from MTA
subcase.2.amhs.priority=FF
subcase.2.amhs.priority-indicator=FF
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=ATS message text - DR expected per test matrix row 2
subcase.2.amhs.originator-report-request=no-report
subcase.2.amhs.originating-mta-report-request=report
subcase.2.amhs.expected-dr=true

# Subcase 3: no-report(0) + audited-report(3) => DR expected
subcase.3.id=CTSW003.3
subcase.3.name=No Report (Originator) + Audited Report (MTA)
subcase.3.description=ATS message with originator-report-request=no-report, originating-MTA-report-request=audited-report
