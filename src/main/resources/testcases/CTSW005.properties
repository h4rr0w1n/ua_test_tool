# Test Case: CTSW005 - Message delivery with different priorities
# Description: Delivery verification for various message priorities with NDR diagnostic codes
# Reference: EUR Doc 047 Appendix A, Page 21; ICAO Doc 9880 Part II (Doc 020), Section 4.5.6
#            EUR Doc 047 Main Document, Section 4.4.8 (NDR Diagnostic Codes)
# Test Criteria: Successful if IUT delivers messages and generates appropriate NDRs with diagnostic codes
# Verification: Check delivery status, NDR reason codes, diagnostic codes per ICAO standards

# ============================================================================
# MESSAGE DELIVERY WITH NDR DIAGNOSTIC CODES
# All undeliverable messages shall generate NDRs with appropriate reason and diagnostic codes
# as specified in ICAO Doc 9880 Part II and EUR Doc 047
# ============================================================================

# Subcase 1: FF priority delivery - successful
subcase.1.id=CTSW005.1
subcase.1.name=FF Priority Delivery - Success
subcase.1.description=Message delivery with FF priority - successful delivery expected
subcase.1.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW005.1 - FF Priority Delivery Success
subcase.1.amhs.priority=FF
subcase.1.amhs.priority-indicator=FF
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Test message delivery with FF priority - successful delivery
subcase.1.amhs.expected-ndr=false
subcase.1.amhs.delivery-status=success

# Subcase 2: SS priority delivery - successful
subcase.2.id=CTSW005.2
subcase.2.name=SS Priority Delivery - Success
subcase.2.description=Message delivery with SS priority - successful delivery expected
subcase.2.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW005.2 - SS Priority Delivery Success
subcase.2.amhs.priority=SS
subcase.2.amhs.priority-indicator=SS
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=Test message delivery with SS priority - successful delivery
subcase.2.amhs.expected-ndr=false
subcase.2.amhs.delivery-status=success

# Subcase 3: DD priority delivery - NDR with diagnostic code
subcase.3.id=CTSW005.3
subcase.3.name=DD Priority Delivery - NDR Expected
subcase.3.description=Message delivery with DD priority to unknown recipient - NDR expected
subcase.3.amhs.recipient=/CN=UNKNOWN_USER/OU=INVALID/O=BAD/PRMD=NONE/ADMD=ICAO/C=XX/
subcase.3.amhs.subject=CTSW005.3 - DD Priority NDR Test
subcase.3.amhs.priority=DD
subcase.3.amhs.priority-indicator=DD
subcase.3.amhs.body-part-type=ia5-text
subcase.3.amhs.content=Test message delivery with DD priority - NDR expected with diagnostic code
subcase.3.amhs.expected-ndr=true
subcase.3.amhs.ndr-reason=unable-to-transfer
subcase.3.amhs.ndr-diagnostic=unrecognised-OR-name

# Subcase 4: KK priority delivery - successful with DR requested
subcase.4.id=CTSW005.4
subcase.4.name=KK Priority Delivery - DR Requested
subcase.4.description=Message delivery with KK priority with delivery report requested
subcase.4.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.4.amhs.subject=CTSW005.4 - KK Priority DR Requested
subcase.4.amhs.priority=KK
subcase.4.amhs.priority-indicator=KK
subcase.4.amhs.body-part-type=ia5-text
subcase.4.amhs.content=Test message delivery with KK priority - DR expected
subcase.4.amhs.originator-report-request=report
subcase.4.amhs.expected-dr=true
subcase.4.amhs.delivery-status=success

# Subcase 5: GG priority delivery - NDR with content-syntax-error
subcase.5.id=CTSW005.5
subcase.5.name=GG Priority Delivery - Content Syntax Error
subcase.5.description=Message delivery with GG priority - NDR with content-syntax-error diagnostic
subcase.5.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.5.amhs.subject=CTSW005.5 - GG Priority Content Error
subcase.5.amhs.priority=GG
subcase.5.amhs.priority-indicator=GG
subcase.5.amhs.body-part-type=unsupported-type
subcase.5.amhs.content=Test message with unsupported body part type
subcase.5.amhs.expected-ndr=true
subcase.5.amhs.ndr-reason=unable-to-transfer
subcase.5.amhs.ndr-diagnostic=content-syntax-error
