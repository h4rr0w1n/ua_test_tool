# Test Case: CTSW001 - Basic AMHS Message Sending
# Description: Basic IPM conversion and sending
# Reference: EUR Doc 047 Appendix A, Section 4

# Subcase 1: Basic message with default priority
subcase.1.id=CTSW001.1
subcase.1.name=Basic Message - Default Priority
subcase.1.description=Basic IPM with recipient, subject, content and default FF priority
subcase.1.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW001.1 - Basic Message
subcase.1.amhs.priority=FF
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=This is a basic ATS message with default priority FF and ia5-text body part.

# Subcase 2: Message with high priority
subcase.2.id=CTSW001.2
subcase.2.name=Basic Message - High Priority
subcase.2.description=Basic IPM with recipient, subject, content and high KK priority
subcase.2.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW001.2 - High Priority Message
subcase.2.amhs.priority=KK
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=This is a basic ATS message with high priority KK and ia5-text body part.

# Subcase 3: Message with low priority
subcase.3.id=CTSW001.3
subcase.3.name=Basic Message - Low Priority
subcase.3.description=Basic IPM with recipient, subject, content and low DD priority
subcase.3.amhs.recipient=/CN=VVTSOPTC/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.3.amhs.subject=CTSW001.3 - Low Priority Message
subcase.3.amhs.priority=DD
subcase.3.amhs.body-part-type=ia5-text
subcase.3.amhs.content=This is a basic ATS message with low priority DD and ia5-text body part.

