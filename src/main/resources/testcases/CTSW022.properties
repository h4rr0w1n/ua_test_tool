# Test Case: CTSW022 - Enhanced NDR Diagnostic Code Coverage
# Description: Comprehensive NDR testing with all diagnostic codes per ICAO standards
# Reference: EUR Doc 047 Appendix A, Page 33; ICAO Doc 9880 Part II (Doc 020), Section 4.5.6
#            EUR Doc 047 Main Document, Section 4.4.8 (NDR Diagnostic Codes)
# Test Criteria: Successful if IUT generates NDRs with all required diagnostic codes
# Verification: Check NDR reason codes, diagnostic codes, supplementary info per ICAO

# ============================================================================
# ENHANCED NDR DIAGNOSTIC CODE COVERAGE
# NDRs shall include appropriate reason and diagnostic codes as specified in
# ICAO Doc 9880 Part II and EUR Doc 047 for all failure scenarios
# ============================================================================

# Subcase 1: NDR with unrecognised-OR-name diagnostic
subcase.1.id=CTSW022.1
subcase.1.name=NDR Unrecognised OR Name
subcase.1.description=Message to unknown recipient - NDR with unrecognised-OR-name
subcase.1.amhs.originator=/CN=AMQP_ORIGINATOR/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/
subcase.1.amhs.recipient=/CN=UNKNOWN_USER/OU=INVALID/O=BAD/PRMD=NONE/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW022.1 - Unrecognised OR Name
subcase.1.amhs.priority=FF
subcase.1.amhs.priority-indicator=FF
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Test message to unknown recipient for NDR generation
subcase.1.amhs.expected-ndr=true
subcase.1.amhs.ndr-reason=unable-to-transfer
subcase.1.amhs.ndr-diagnostic=unrecognised-OR-name

