subcase.2.amhs.primary-recipients=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/,/CN=User2/OU=Test/O=TestOrg/PRMD=TestPRMD/ADMD=/C=US/
subcase.2.amhs.subject=CTSW007.2 - Multi-recipient General Text
subcase.2.amhs.priority=FF
subcase.2.amhs.priority-indicator=FF
subcase.2.amhs.body-part-type=general-text-body-part
subcase.2.amhs.charset-reg-numbers=1,6
subcase.2.amhs.repertoire=ISO646
subcase.2.amhs.content=Test message with multiple recipients using general-text-body-part
subcase.2.amhs.expected-ndr=false
subcase.2.amhs.structure-validation=passed

