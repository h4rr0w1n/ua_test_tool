# Test Case: CTSW007 - Message structure validation with file-transfer-body-part support
# Description: Validation of different message structures including file-transfer-body-part
# Reference: EUR Doc 047 Appendix A, Page 23; ICAO Doc 9880 Part II (Doc 020), Section 4.5.5
#            EUR Doc 047 Main Document, Section 4.4.2.3 (File-Transfer-Body-Part)
# Test Criteria: Successful if IUT validates message structures and supports file-transfer-body-part
# Verification: Check message structure handling, file-transfer-body-part conversion, NDR for unsupported types

# ============================================================================
# MESSAGE STRUCTURE VALIDATION WITH FILE-TRANSFER-BODY-PART SUPPORT
# Messages shall support ia5-text, general-text-body-part, and file-transfer-body-part
# as specified in ICAO Doc 9880 Part II and EUR Doc 047
# ============================================================================

# Subcase 1: Simple message - ia5-text body part
subcase.1.id=CTSW007.1
subcase.1.name=Simple Message - IA5 Text
subcase.1.description=Basic ATS message structure with ia5-text body part
subcase.1.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW007.1 - Simple IA5 Text Message
subcase.1.amhs.priority=FF
subcase.1.amhs.priority-indicator=FF
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Simple test message structure with ia5-text body part
subcase.1.amhs.expected-ndr=false
subcase.1.amhs.structure-validation=passed

