# Test Case: CTSW021 - Enhanced Probe Conveyance Testing
# Description: Comprehensive probe testing with multiple scenarios per ICAO standards
# Reference: EUR Doc 047 Appendix A, Page 28; ICAO Doc 9880 Part II (Doc 020), Section 4.5.8
#            EUR Doc 047 Main Document, Section 4.4.6 (Probe Messages)
# Test Criteria: Successful if IUT handles all probe scenarios with appropriate DR/NDR generation
# Verification: Check probe content-length validation, recipient validation, DR/NDR diagnostic codes

# ============================================================================
# ENHANCED PROBE CONVEYANCE TESTING
# Probes shall be tested for various scenarios including valid/invalid recipients,
# content-length limits, and originator validation as specified in ICAO standards
# ============================================================================

# Subcase 1: Probe with valid content-length and reachable consumer - DR expected
subcase.1.id=CTSW021.1
subcase.1.name=Probe Valid Content Length Reachable Consumer
subcase.1.description=Probe with content-length within limits to reachable consumer - DR expected
subcase.1.amhs.recipient=/CN=AMQP_CONSUMER_1/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/
subcase.1.amhs.priority=FF
subcase.1.amhs.priority-indicator=FF
subcase.1.amhs.content-length=1000
subcase.1.amhs.max-message-data-size=131072
subcase.1.amhs.consumer-reachable=true
subcase.1.amhs.expected-report=DR
subcase.1.amhs.probe-validation=passed

# Subcase 2: Probe with unreachable consumer - NDR expected
subcase.2.id=CTSW021.2
subcase.2.name=Probe Unreachable Consumer
subcase.2.description=Probe addressing unreachable consumer - NDR with unable-to-transfer
subcase.2.amhs.recipient=/CN=UNKNOWN_CONSUMER/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/
subcase.2.amhs.priority=FF
subcase.2.amhs.priority-indicator=FF
subcase.2.amhs.content-length=1000
subcase.2.amhs.consumer-reachable=false
subcase.2.amhs.expected-report=NDR
subcase.2.amhs.ndr-reason=unable-to-transfer
subcase.2.amhs.ndr-diagnostic=unrecognised-OR-name

# Subcase 3: Probe exceeds content-length limit - NDR expected
subcase.3.id=CTSW021.3
subcase.3.name=Probe Exceeds Content Length
subcase.3.description=Probe with content-length exceeding maximum message data size - NDR expected
subcase.3.amhs.recipient=/CN=AMQP_CONSUMER_1/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/
subcase.3.amhs.priority=FF
subcase.3.amhs.priority-indicator=FF
subcase.3.amhs.content-length=200000
subcase.3.amhs.max-message-data-size=131072
subcase.3.amhs.expected-report=NDR
subcase.3.amhs.ndr-reason=unable-to-transfer
subcase.3.amhs.ndr-diagnostic=content-length-exceeded

# Subcase 4: Probe with mixed valid and unknown recipients - partial NDR
subcase.4.id=CTSW021.4
subcase.4.name=Probe Mixed Valid And Unknown Recipients
subcase.4.description=Probe with multiple recipients: some valid, some unknown - NDR for unknown
subcase.4.amhs.primary-recipients=/CN=VALID_CONSUMER/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/,/CN=UNKNOWN_CONSUMER/OU=INVALID/O=BAD/PRMD=NONE/ADMD=ICAO/C=XX/
subcase.4.amhs.priority=SS
subcase.4.amhs.priority-indicator=SS
subcase.4.amhs.content-length=5000
subcase.4.amhs.first-recipient-valid=true
subcase.4.amhs.second-recipient-valid=false
subcase.4.amhs.expected-ndr-for-unknown=true
subcase.4.amhs.ndr-reason=unable-to-transfer
subcase.4.amhs.ndr-diagnostic=unrecognised-OR-name

# Subcase 5: Probe with unknown originator - NDR expected
subcase.5.id=CTSW021.5
subcase.5.name=Probe With Unknown Originator
subcase.5.description=Probe with invalid originator that cannot be translated - NDR expected
subcase.5.amhs.originator=/CN=UNKNOWN_ORIGINATOR/OU=INVALID/O=BAD/PRMD=NONE/ADMD=ICAO/C=XX/
subcase.5.amhs.primary-recipients=/CN=AMQP_CONSUMER_1/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/,/CN=AMQP_CONSUMER_2/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/
subcase.5.amhs.priority=GG
subcase.5.amhs.priority-indicator=GG
subcase.5.amhs.content-length=2000
subcase.5.amhs.originator-valid=false
subcase.5.amhs.expected-ndr=true
subcase.5.amhs.ndr-reason=unable-to-transfer
subcase.5.amhs.ndr-diagnostic=invalid-arguments

# Subcase 6: Probe with KK priority (highest) - DR expected
subcase.6.id=CTSW021.6
subcase.6.name=Probe Highest Priority KK
subcase.6.description=Probe with highest priority KK to valid consumer - DR expected
subcase.6.amhs.recipient=/CN=AMQP_CONSUMER_1/OU=TEST/O=GATEWAY/PRMD=SWIM/ADMD=ICAO/C=EU/
