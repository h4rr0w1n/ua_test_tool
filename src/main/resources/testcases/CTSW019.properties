# Test Case: CTSW019
# Description: Incoming IPM with a general-text-body-part and a repertoire different from ISO 646
# Reference: EUR Doc 047 Appendix A, Page 36-37
# Test Class: Erroneous MHS information objects (E3)
# Ref: 4.4.2.3, 4.4.3.3.3, 4.4.3.4.9, 4.4.4.5, Table 6
# Note 1: Acceptance or rejection depends on local AMHS Management Domain policy.
#
# All messages shall contain general-text-body-part with ATS-message-header and ATS-message-text.
# original-EIT = extended OID {id-cs-eit-authority 100}
# implicit-conversion-prohibited = implicit-conversion-allowed
# Message text shall include ISO 646 (US-ASCII) and non-listed US-ASCII characters.

# Subcase 1: ISO 8859-1 repertoire (charset numbers 1, 6, 100) - Western European
subcase.1.id=CTSW019.1
subcase.1.name=ISO 8859-1
subcase.1.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW019.1
subcase.1.amhs.body-part-type=general-text-body-part
subcase.1.amhs.charset-reg-numbers=1,6,100
subcase.1.amhs.eit-type=extended
subcase.1.amhs.eit-oid=id-cs-eit-authority-100
subcase.1.amhs.implicit-conversion=allowed
subcase.1.amhs.content=Test ISO 8859-1 Western European content with special chars

# Subcase 2: Cyrillic/Arabic/Greek/Hebrew repertoire (per ISO/IEC ISP 12062-2 A.1.3.2)
subcase.2.id=CTSW019.2
subcase.2.name=Other (Cyrillic, Arabic, Greek, Hebrew)
subcase.2.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW019.2
subcase.2.amhs.body-part-type=general-text-body-part
subcase.2.amhs.charset-source=iso-isp-12062-2-A132-cyrillic-arabic-greek-hebrew
subcase.2.amhs.eit-type=extended
subcase.2.amhs.eit-oid=id-cs-eit-authority-100
subcase.2.amhs.implicit-conversion=allowed
subcase.2.amhs.content=Test non-ISO646 repertoire Cyrillic/Arabic/Greek/Hebrew

# Subcase 3: Chinese/Japanese/Korean repertoire (per ISO/IEC ISP 12062-2 A.1.3.2)
subcase.3.id=CTSW019.3
subcase.3.name=Other (Chinese, Japanese, Korean)
subcase.3.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
