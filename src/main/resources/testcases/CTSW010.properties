# Test Case: CTSW010
# Description: Reject an IPM addressing more AMQP consumers than the maximum configured
# Reference: EUR Doc 047 Appendix A, Page 26
# Test Class: Procedural errors (E2)
# Ref: 4.4.2.7, 4.4.8
#
# These messages shall have the originator-report-request flag set to "non-delivery-report".
# Maximum message number of recipients parameter is set to 512.

# Subcase 1 (a): IPM with 512 recipients (within limit)
#   -> Message received at AMQP test interface
subcase.1.id=CTSW010.1
subcase.1.name=Recipients within Limit
subcase.1.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW010.1
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Test 1 - 512 recipients within limit
subcase.1.amhs.originator-report-request=non-delivery-report
subcase.1.amhs.recipient-count=512
subcase.1.amhs.expected-result=accepted

# Subcase 2 (b): IPM with 513 recipients (exceeds limit)
#   -> IUT rejects for all recipients; returns NDR:
#      non-delivery-reason-code     : unable-to-transfer
#      non-delivery-diagnostic-code : too-many-recipients
#      supplementary-information    : unable to convert to AMQP due to number of recipients
subcase.2.id=CTSW010.2
subcase.2.name=Recipients exceed Limit
subcase.2.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.2.amhs.subject=CTSW010.2
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=Test 2 - 513 recipients exceed limit
subcase.2.amhs.originator-report-request=non-delivery-report
subcase.2.amhs.recipient-count=513
subcase.2.amhs.expected-result=NDR
subcase.2.amhs.expected-ndr-reason=unable-to-transfer
subcase.2.amhs.expected-ndr-diagnostic=too-many-recipients
subcase.2.amhs.expected-ndr-supplementary=unable to convert to AMQP due to number of recipients
