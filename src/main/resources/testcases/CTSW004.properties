subcase.2.amhs.priority=SS
subcase.2.amhs.priority-indicator=SS
subcase.2.amhs.body-part-type=ia5-text
subcase.2.amhs.content=ATS message with supervisory priority and full ARC-7 address components
subcase.2.amhs.arc7-compliant=true
subcase.2.amhs.or-address-format=standard-arc7
subcase.2.amhs.address-components=cn,ou,o,prmd,admd,c

