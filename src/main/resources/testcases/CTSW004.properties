# Test Case: CTSW004 - Basic message validation
# Description: Message validation with different priorities and ARC-7 format compliance
# Reference: EUR Doc 047 Appendix A, Page 20; ICAO Doc 9880 Part II (Doc 020), Section 4.5.3
#            EUR Doc 047 Main Document, Section 3.2.1 (ARC-7 Addressing Format)
# Test Criteria: Successful if IUT validates IPM messages according to ICAO standards
# Verification: Check O/R address format compliance with ARC-7, priority mapping, body part validation

# ============================================================================
# BASIC MESSAGE VALIDATION WITH ARC-7 FORMAT COMPLIANCE
# All O/R addresses shall conform to ARC-7 format as specified in ICAO Doc 9880 Part II
# ============================================================================

# Subcase 1: Standard message with FF priority - ARC-7 compliant O/R address
subcase.1.id=CTSW004.1
subcase.1.name=Standard Message - ARC-7 Compliant
subcase.1.description=Basic valid ATS message with ARC-7 compliant O/R address format
subcase.1.amhs.recipient=/CN=VVTSMHSA/OU=VVTS/O=VVTS/PRMD=VIETNAM/ADMD=ICAO/C=XX/
subcase.1.amhs.subject=CTSW004.1 - Standard Message FF Priority
subcase.1.amhs.priority=FF
subcase.1.amhs.priority-indicator=FF
subcase.1.amhs.body-part-type=ia5-text
subcase.1.amhs.content=Standard ATS message for validation testing with ARC-7 address format
subcase.1.amhs.arc7-compliant=true
subcase.1.amhs.or-address-format=standard-arc7

# Subcase 2: SS priority message - ARC-7 compliant with full addressing
subcase.2.id=CTSW004.2
subcase.2.name=SS Priority - Full ARC-7 Address
